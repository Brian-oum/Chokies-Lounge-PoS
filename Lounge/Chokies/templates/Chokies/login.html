{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Chokies Lounge</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'Chokies/pos.css' %}" rel="stylesheet"></head>
<body class="login-body" data-next="{{ next }}">
{% csrf_token %}
<div class="login-card wide">
  <h1 class="h3 mb-3">Chokies Lounge</h1>
  <div id="step1">
    <p class="text-muted">Tap your name to sign in.</p>
    <div class="tile-grid">
      {% for u in staff %}<button class="tile" data-id="{{ u.id }}" data-name="{{ u.first_name|default:u.username }}">{{ u.first_name|default:u.username }}<small>{{ u.get_role_display }}</small></button>
      {% empty %}<p class="text-danger">No staff have a PIN yet. Set one for each user in the admin.</p>{% endfor %}
    </div>
  </div>
  <div id="step2" class="d-none">
    <button id="back" class="btn btn-link p-0 mb-2">Not you? Go back</button>
    <h2 class="h5">Enter PIN for <span id="who"></span></h2>
    <div id="dots" class="dots" aria-live="polite"></div>
    <div id="msg" class="text-danger small mb-2"></div>
    <div class="pad">
      {% for n in "123456789" %}<button class="btn btn-light" data-k="{{ n }}">{{ n }}</button>{% endfor %}
      <button class="btn btn-outline-secondary" data-k="clear">Clear</button>
      <button class="btn btn-light" data-k="0">0</button>
      <button class="btn btn-outline-secondary" data-k="back">Delete</button>
    </div>
    <button id="go" class="btn btn-brand btn-lg w-100 mt-3" disabled>Sign in</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let uid = null, pin = '';
function draw() { $('#dots').textContent = pin ? '●'.repeat(pin.length) : '····'; $('#go').disabled = pin.length < 4; }
function key(k) { $('#msg').textContent = ''; if (k === 'clear') pin = ''; else if (k === 'back') pin = pin.slice(0, -1); else if (pin.length < 6) pin += k; draw(); }
document.querySelectorAll('.tile').forEach(b => b.onclick = () => { uid = b.dataset.id; $('#who').textContent = b.dataset.name; $('#step1').classList.add('d-none'); $('#step2').classList.remove('d-none'); pin = ''; draw(); });
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => key(b.dataset.k));
$('#back').onclick = () => { $('#step2').classList.add('d-none'); $('#step1').classList.remove('d-none'); pin = ''; };
async function go() {
  if (pin.length < 4) return;
  const r = await fetch(location.pathname, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
    body: JSON.stringify({ user_id: uid, pin, next: document.body.dataset.next }) });
  const d = await r.json().catch(() => ({}));
  if (r.ok) location.href = d.redirect; else { $('#msg').textContent = d.detail || 'Could not sign in.'; pin = ''; draw(); }
}
$('#go').onclick = go;
document.addEventListener('keydown', e => { if ($('#step2').classList.contains('d-none')) return;
  if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('back'); else if (e.key === 'Enter') go(); });
</script></body></html>
